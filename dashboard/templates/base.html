<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Huisjagers{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#eef3fc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef3fc;
      --card: rgba(255,255,255,0.86);
      --card-soft: #e4ebfb;
      --border: rgba(91,58,152,0.14);
      --border-strong: rgba(91,58,152,0.28);
      --text: #2a1740;
      --text-muted: #6b5f84;
      --violet: #63389e;
      --violet-bright: #7c4fbe;
      --blue: #3d56d6;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0; color: var(--text);
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(238,243,252,0.45), rgba(238,243,252,0.45)),
        url('/static/main-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
    .page { max-width: 960px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    h1, h2 { font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
    h1 { margin-bottom: 0.3rem; font-size: 1.85rem; text-shadow: 0 1px 16px rgba(238,243,252,0.9), 0 1px 3px rgba(238,243,252,0.9); }
    .subtitle { color: var(--text-muted); margin-top: 0; text-shadow: 0 1px 12px rgba(238,243,252,0.9), 0 1px 3px rgba(238,243,252,0.9); }
    nav.topbar { background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    nav.topbar .inner { max-width: 960px; margin: 0 auto; padding: 0.9rem 1.25rem; display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; }
    nav.topbar a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    nav.topbar a:hover { color: var(--text); }
    nav.topbar .brand { font-weight: 800; font-size: 1.15rem; color: var(--text); margin-right: auto; letter-spacing: -0.02em; }
    nav.topbar form { margin: 0; }
    nav.topbar button.link { background: none; border: none; color: var(--text-muted); font: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; padding: 0; text-decoration: none; }
    nav.topbar button.link:hover { color: var(--text); }
    form.filters { margin: 1rem 0; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    table {
      width: 100%; border-collapse: collapse; background: var(--card);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.5); border-radius: 1.1rem; overflow: hidden;
      box-shadow: 0 16px 45px rgba(42,23,64,0.16);
    }
    th, td { text-align: left; padding: 0.75rem 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.87rem; overflow-wrap: break-word; }
    th {
      background: rgba(228,235,251,0.7); color: var(--text-muted); padding: 0;
      font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em;
    }
    a.sort-link { display: block; padding: 0.75rem 0.85rem; color: inherit; text-decoration: none; }
    a.sort-link:hover { color: var(--text); background: rgba(91,58,152,0.06); }
    .sort-arrow { color: var(--violet-bright); font-size: 0.7rem; }
    .amenities { color: var(--text-muted); font-size: 0.78rem; }
    .row-toggle {
      background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.7rem;
      padding: 0; margin-right: 0.5rem; display: inline-block; transition: transform 0.15s, color 0.15s;
    }
    .row-toggle:hover { color: var(--violet-bright); }
    .row-toggle.open { transform: rotate(90deg); }
    tr.hidden-row { display: none; }
    tr.detail-row td { background: var(--card-soft); padding: 1.4rem 1.9rem 1.6rem; }
    .listing-detail-label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted); margin: 0 0 0.45rem;
    }
    .listing-description { margin: 0 0 1.1rem; color: var(--text); font-size: 0.92rem; line-height: 1.65; max-width: 68ch; white-space: pre-wrap; }
    a.secondary.maps-link { display: inline-flex; align-items: center; gap: 0.4rem; }
    a.listing-link { color: var(--blue); text-decoration: none; font-weight: 600; }
    a.listing-link:hover { color: var(--violet-bright); text-decoration: underline; }
    .badge { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 1rem; font-size: 0.7rem; font-weight: 600; }
    .badge.pet { background: rgba(139,92,246,0.18); color: var(--violet-bright); }
    .card {
      background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.5); border-radius: 1.1rem;
      box-shadow: 0 16px 45px rgba(42,23,64,0.16); padding: 1.9rem 2.1rem; margin: 1.1rem 0;
    }
    .card h2 { margin-top: 0; font-size: 1.1rem; }
    code {
      background: rgba(139,92,246,0.14); color: var(--violet-bright); padding: 0.15rem 0.45rem;
      border-radius: 0.3rem; font-size: 0.85em; font-family: 'JetBrains Mono', ui-monospace, monospace;
    }
    .field-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .field { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 140px; }
    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
    input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
      padding: 0.5rem 0.65rem; border: 1px solid var(--border-strong); border-radius: 0.5rem;
      font: inherit; background: var(--card-soft); color: var(--text);
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139,92,246,0.25); }
    textarea { min-height: 4rem; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #a89fbb; opacity: 1; }
    button.primary, input[type=submit] {
      background: var(--violet); color: #fff; border: 1px solid var(--violet); border-radius: 0.5rem;
      padding: 0.55rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    button.primary:hover, input[type=submit]:hover { background: #713fb0; box-shadow: 0 0 0 4px rgba(99,56,158,0.2); }
    button.primary:active, input[type=submit]:active { background: #542f87; }
    button.secondary, a.secondary {
      background: rgba(91,58,152,0.05); color: var(--text); border: 1px solid var(--border-strong); border-radius: 0.5rem;
      padding: 0.45rem 0.85rem; font: inherit; font-weight: 500; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
      text-decoration: none; display: inline-block; box-sizing: border-box; transition: background 0.15s, border-color 0.15s;
    }
    button.secondary:hover, a.secondary:hover { background: rgba(91,58,152,0.10); border-color: rgba(91,58,152,0.35); }
    a.link-plain { color: var(--blue); font-size: 0.85rem; align-self: center; font-weight: 500; text-decoration: none; }
    a.link-plain:hover { color: var(--violet-bright); }
    .input-with-button { display: flex; gap: 0.5rem; align-items: center; }
    .input-with-button input { flex: 1; }
    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.65rem;
      width: 100%; padding: 0.65rem 1rem; background: #fff; color: #3c4043;
      border: 1px solid var(--border-strong); border-radius: 0.5rem;
      font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .google-btn:hover { box-shadow: 0 2px 8px rgba(42,23,64,0.18); }
    .auth-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.1rem 0; color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .auth-card button.primary { width: 100%; }
    body.auth-bg .page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding-top: 0; padding-bottom: 0;
    }
    body.auth-bg .auth-card { margin: 0; }
    .auth-card-header { text-align: center; margin-bottom: 1.5rem; }
    .auth-card-header h1 { font-size: 1.6rem; margin: 0 0 0.35rem; }
    .auth-card-header p { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
    .filter-panel {
      background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.5); border-radius: 1.1rem;
      box-shadow: 0 16px 45px rgba(42,23,64,0.16); padding: 1.6rem 1.9rem; margin: 0.5rem 0 1rem;
    }
    .filter-panel .filter-row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-bottom: 0; }
    .filter-panel .field { min-width: 100px; flex: 1; }
    .filter-panel input[type=number] { width: 100%; }
    .filter-panel .pet-friendly-row { margin-top: 0.75rem; font-size: 0.9rem; color: var(--text); display: flex; gap: 1.25rem; flex-wrap: wrap; }
    .filter-panel details { margin-top: 0.6rem; }
    .filter-panel summary { cursor: pointer; font-size: 0.85rem; color: var(--blue); font-weight: 500; }
    .filter-actions { display: flex; gap: 0.75rem; margin-top: 0.85rem; flex-wrap: wrap; align-items: center; }
    .filter-status { margin: 0.6rem 0 0; }
    .apply-to { display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap; margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .apply-to-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .apply-to-option { font-size: 0.9rem; display: flex; align-items: center; gap: 0.3rem; white-space: nowrap; }
    .error { color: var(--red); background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: 0.5rem; padding: 0.6rem 0.85rem; margin-bottom: 1rem; }
    p.nag {
      color: var(--amber); background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); border-radius: 0.5rem;
      padding: 0.6rem 0.85rem; font-size: 0.85rem;
    }
    p.nag a { color: var(--amber); font-weight: 700; }
    .city-status-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .city-status-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .city-status-row:last-child { border-bottom: none; }
    .city-status-name { font-weight: 600; min-width: 110px; }
    .city-status-badge { font-size: 0.75rem; padding: 0.15rem 0.55rem; border-radius: 1rem; white-space: nowrap; font-weight: 600; }
    .city-status-badge.on { background: rgba(74,222,128,0.15); color: var(--green); }
    .city-status-badge.unconfigured { background: rgba(251,191,36,0.15); color: var(--amber); }
    .city-status-badge.opted_out { background: rgba(91,58,152,0.08); color: var(--text-muted); }
    .city-status-summary { font-size: 0.8rem; color: var(--text-muted); flex: 1; min-width: 150px; }
    .city-status-actions { display: flex; gap: 0.6rem; align-items: center; }
    .hint { color: var(--text-muted); font-size: 0.8rem; }
    .auth-card { max-width: 380px; margin: 3rem auto; position: relative; z-index: 1; }
    body.auth-bg {
      background-color: #2a1740;
      background-image:
        linear-gradient(rgba(42,23,64,0.55), rgba(42,23,64,0.55)),
        url('/static/auth-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }
    @media (max-width: 600px) {
      table, thead, tbody, tr { display: block; }
      thead { display: none; }
      tr { margin-bottom: 0.75rem; border-bottom: 1px solid var(--border-strong); }
      td { display: flex; justify-content: space-between; gap: 1rem; border-bottom: none; }
      td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); }
      tr.detail-row td { display: block; }
      tr.detail-row td::before { content: none; }
    }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block nav %}
  <nav class="topbar">
    <div class="inner">
      <span class="brand">Huisjagers</span>
      {% if session %}
        <a href="/">My Matches</a>
        <a href="/templates">Templates</a>
        <a href="/account">Account</a>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
          <button class="link" type="submit">Logout ({{ session.email }})</button>
        </form>
      {% else %}
        <a href="/login">Login</a>
        <a href="/signup">Sign up</a>
      {% endif %}
    </div>
  </nav>
  {% endblock %}
  <div class="page">
    {% block content %}{% endblock %}
  </div>
  <script>
    function toggleRow(btn, id) {
      const row = document.getElementById(id);
      if (!row) return;
      row.classList.toggle('hidden-row');
      btn.classList.toggle('open');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }

    // A guessable topic name defeats the point - anyone who knows it can
    // subscribe (or publish) to it, since ntfy topics have no access
    // control beyond obscurity. Random client-side generation avoids
    // people picking something short/memorable/guessable instead.
    function generateNtfyTopic(inputId) {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      const bytes = new Uint8Array(20);
      crypto.getRandomValues(bytes);
      let slug = '';
      for (let i = 0; i < bytes.length; i++) {
        slug += chars[bytes[i] % chars.length];
      }
      document.getElementById(inputId).value = 'https://ntfy.sh/huisjagers-' + slug;
    }
  </script>
</body>
</html>
