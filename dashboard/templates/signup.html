{% extends "base.html" %}
{% block title %}Sign up - Huisjagers{% endblock %}
{% block content %}
<div class="card auth-card">
  <h2>Sign up</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup">
    <div class="field-row">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="invite_code">Invite code</label>
        <input type="text" id="invite_code" name="invite_code" required>
      </div>
    </div>
    <button class="primary" type="submit">Sign up</button>
    {% if google_enabled %}
      <button class="secondary" type="submit" formaction="/auth/google/start" formnovalidate style="margin-left: 0.5rem;">Continue with Google</button>
    {% endif %}
  </form>
  <p class="hint">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
